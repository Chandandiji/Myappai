name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version must be 17 or higher (detected: $JAVA_MAJOR)."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already present in repository root."
          else
            echo "Generating temporary debug keystore with keytool..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Discovered APK files under app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is an empty file (0 bytes)."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have the .apk extension."
            exit 1
          fi
          echo "Confirmed valid APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RUNNER_TMP_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "asset_tag=debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "release_title=Debug APK Build #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH ($ASSET_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.asset_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Pre-release verification failed for asset $ASSET_PATH"
            exit 1
          fi

          NOTES_FILE=$(mktemp)
          cat <<EOF > "$NOTES_FILE"
          ### Android Debug APK Build
          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA**: ${GITHUB_SHA}
          - **Testing Notice**: Intended for testing only; not a Play Store production release.
          - **Signing**: Signed using a temporary debug keystore.

          Download **${ASSET_NAME}** below under Assets to install on your Android device.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.prepare_asset.outputs.asset_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Released"
              echo ""
              echo "Your debug APK has been published to GitHub Releases:"
              echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Download File**: \`$ASSET_NAME\` (available under the **Assets** section)"
              echo ""
              echo "> 📦 **Actions Artifact Backup**: The standard workflow artifact \`app-debug-apk\` is also available for download in this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed. The debug APK build and artifact upload completed successfully."
            echo "The Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was built successfully and is preserved as an Actions artifact:"
              echo "- **Artifact Name**: \`app-debug-apk\`"
              echo "- You can download the APK from the **Artifacts** section at the bottom of this Actions run page."
              echo ""
              echo "*Note: Direct GitHub Release creation encountered an issue, but your build output is safely stored.*"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
